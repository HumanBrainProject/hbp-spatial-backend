name: '[build] docker image'

env:
  DOCKER_REPO: docker-registry.ebrains.eu
  DOCKER_NAMESPACE: hbp-spatial-backend
  DOCKER_IMAGE: server
  DOCKER_TAG: latest
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

on:
  push:
    branches:
    - main
    - imgbuild
jobs:

  setup-envvar:
    if: github.repository_owner == 'HumanBrainProject' and ${{ env.DOCKER_USERNAME != '' }} and ${{ env.DOCKER_PASSWORD != '' } }
    runs-on: ubuntu-latest
    outputs:
      BASE_IMG: ${{ steps.export-env-var.outputs.BASE_IMG }}
      BASE_TAG: ${{ steps.export-env-var.outputs.BASE_TAG }}
    steps:
    - uses: actions/checkout@v4
    - name: 'Setting tag'
      if: ${{ contains(github.ref, 'imgbuild') }}
      run: |
        echo BASE_TAG=-imgbuild >> $GITHUB_ENV
    
    - name: 'export env var'
      id: export-env-var
      run: |
        BASE_IMG=${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAMESPACE }}/${{ env.DOCKER_IMAGE }}
        echo BASE_IMG=$BASE_IMG >> $GITHUB_OUTPUT
        echo BASE_TAG=${BASE_TAG} >> $GITHUB_OUTPUT

  build-base-image:
    needs:
    - setup-envvar
    env:
      IMG_TAG: "${{ needs.setup-envvar.outputs.BASE_IMG }}:base${{ needs.setup-envvar.outputs.BASE_TAG }}"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build base image
      run: |
        docker build -t '${{ env.IMG_TAG }}' .
    - name: Push
      run: |
        curl https://${{ env.DOCKER_REPO }} # or else docker login will fail
        echo '${{ env.DOCKER_PASSWORD }}' | docker login \
          -u '${{ env.DOCKER_USERNAME }}' \
          --password-stdin \
          ${{ env.DOCKER_REPO }}
        docker push '${{ env.IMG_TAG }}'

