name: "[build] docker image"

env:
  DOCKER_REPO: docker-registry.ebrains.eu
  DOCKER_NAMESPACE: hbp-spatial-backend
  DOCKER_IMAGE: server
  DOCKER_TAG: latest
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

on:
  push:
    branches:
      - main
      - imgbuild
jobs:
  setup-envvar:
    if: github.repository_owner == 'HumanBrainProject'
    runs-on: ubuntu-latest
    outputs:
      BASE_IMG: ${{ steps.export-env-var.outputs.BASE_IMG }}
      BASE_TAG: ${{ steps.export-env-var.outputs.BASE_TAG }}
      MR_TITLE: ${{ steps.export-env-var.outputs.MR_TITLE }}
      DEPLOY_FILE: ${{ steps.export-env-var.outputs.DEPLOY_FILE }}
      DELTA_B64: ${{ steps.export-env-var.outputs.DELTA_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: "Setting tag"
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        run: |
          if [[ "${{ github.ref }}" == *"imgbuild"* ]]
          then
            echo BASE_TAG=-imgbuild >> $GITHUB_ENV
            echo "MR_TITLE=hbp-spatial-backend imgbuild deploy ${GITHUB_SHA::7}" >> $GITHUB_ENV
            echo DEPLOY_FILE=hbp-spatial-backend/hbp-spatial-backend/values/prod/values.yaml >> $GITHUB_ENV
            cat > /tmp/delta.yaml << EOF
            podAnnotations:
              hash: "h-${GITHUB_SHA}"
            EOF
            echo "DELTA_B64=$(base64 -w 0 /tmp/delta.yaml)" >> "$GITHUB_OUTPUT"
          fi

      - name: "export env var"
        id: export-env-var
        run: |
          BASE_IMG=${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAMESPACE }}/${{ env.DOCKER_IMAGE }}
          echo BASE_IMG=$BASE_IMG >> $GITHUB_OUTPUT
          echo BASE_TAG=$BASE_TAG >> $GITHUB_OUTPUT

  build-base-image:
    needs:
      - setup-envvar
    outputs:
      BASE_IMG_TAG: ${{ steps.push-img.outputs.BASE_IMG_TAG }}
    env:
      IMG_TAG: "${{ needs.setup-envvar.outputs.BASE_IMG }}:base${{ needs.setup-envvar.outputs.BASE_TAG }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build base image
        run: |
          docker build -t '${{ env.IMG_TAG }}' .
      - id: push-img
        name: Push
        run: |
          curl https://${{ env.DOCKER_REPO }} # or else docker login will fail
          echo '${{ env.DOCKER_PASSWORD }}' | docker login \
            --username '${{ env.DOCKER_USERNAME }}' \
            --password-stdin \
            '${{ env.DOCKER_REPO }}'
          docker push '${{ env.IMG_TAG }}'
          docker logout '${{ env.DOCKER_REPO }}'
          echo BASE_IMG_TAG=$IMG_TAG >> $GITHUB_OUTPUT

  build-server-image:
    needs:
      - build-base-image
      - setup-envvar
    env:
      IMG_TAG: ${{ needs.setup-envvar.outputs.BASE_IMG }}:server${{ needs.setup-envvar.outputs.BASE_TAG }}
      FROM_IMG_TAG: ${{ needs.build-base-image.outputs.BASE_IMG_TAG }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          curl https://${{ env.DOCKER_REPO }} # or else docker login will fail
          docker build \
            -t '${{ env.IMG_TAG }}' \
            --build-arg 'BASE_IMAGE=${{ env.FROM_IMG_TAG }}' \
            -f Dockerfile.server \
            .
      - name: "Build and Push"
        run: |
          curl https://${{ env.DOCKER_REPO }} # or else docker login will fail
          echo '${{ env.DOCKER_PASSWORD }}' | docker login \
            --username '${{ env.DOCKER_USERNAME }}' \
            --password-stdin \
            '${{ env.DOCKER_REPO }}'
          docker push '${{ env.IMG_TAG }}'
          docker logout '${{ env.DOCKER_REPO }}'

  trigger-deploy-rancher:
    needs:
      - build-server-image
      - setup-envvar
    runs-on: ubuntu-latest
    steps:
    - run: |
        DEPLOY_FILE="${{ needs.setup-envvar.outputs.DEPLOY_FILE }}"
        DELTA_B64="${{ needs.setup-envvar.outputs.DELTA_B64 }}"
        if [[ -z "$DEPLOY_FILE" || -z "$DELTA_B64" ]]; then
          echo "DEPLOY_FILE or DELTA_B64 is undefined, skipping deploy"
          exit 1
        fi

        UPDATE_FILES=$(jq -cn \
          --arg filename "$DEPLOY_FILE" \
          --arg delta "$DELTA_B64" \
          '[{"filename": $filename, "delta": $delta}]')
        
        MR_TITLE="${{ needs.setup-envvar.outputs.MR_TITLE }}"

        curl -fL -X POST \
          --form "token=${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
          --form "ref=main" \
          --form "variables[UPDATE_FILES]=$UPDATE_FILES" \
          --form "variables[MR_TITLE]=$MR_TITLE" \
          "${{ secrets.GITLAB_GITOPS_URL }}/api/v4/projects/${{ secrets.GITLAB_GITOPS_PROJECT_ID }}/trigger/pipeline"
