name: '[test]'

on: [push]

jobs:
  # The package imports `from soma import aims` at module load time. `soma`
  # (PyAims / BrainVISA) is only distributed as a conda package on the
  # neuro-forge channel, so the test environment must be set up with pixi,
  # exactly like the Dockerfile does. Plain `setup-python` + `pip`/`tox` cannot
  # provide `soma`.
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pixi
      run: |
        curl -fsSL https://pixi.sh/install.sh | bash
        echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

    - name: Set up the BrainVISA (soma) environment
      run: |
        # Mirrors the Dockerfile: a pixi project with the neuro-forge and
        # conda-forge channels providing the `soma` package and the `bv`
        # launcher.
        # n.b. update setup here if Dockerfile changes
        pixi init -c https://brainvisa.info/neuro-forge -c conda-forge
        # Add every conda dependency first, then generate the bin links LAST.
        # `bv_update_bin_links` creates the `bv` launcher (and links to the
        # BrainVISA commands); adding packages afterwards re-solves the env and
        # wipes those links, causing `bv: command not found`.
        # setuptools/wheel are required to build the setup.py-based package
        # (see Dockerfile.server, which adds them for the same reason).
        pixi add soma=6.0.19 pip setuptools wheel pytest
        pixi run bv_update_bin_links
        # `bv_update_bin_links` writes the `bv` launcher (and the BrainVISA
        # command links) into the pixi project's own `bin/` directory, NOT into
        # the pixi env, so `pixi run bv` cannot find it. Put that `bin/` on the
        # PATH for the following steps, then call `bv` directly (as the
        # Dockerfiles do).
        echo "$PWD/bin" >> "$GITHUB_PATH"

    - name: Install the package
      run: |
        # `bv` runs the command inside the configured BrainVISA environment.
        # Installed with pip to pull the Flask runtime dependencies and the test
        # extras from setup.py.
        bv python -m pip install --no-cache-dir -e ".[tests]"

    - name: Test with pytest
      run: |
        # `bv` runs the command inside the configured BrainVISA environment so
        # that `soma` is importable and `AimsApplyTransform` is on the PATH.
        bv python -m pytest tests/

  codestyle:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
    - name: Run pre-commit hooks
      run: pre-commit run --all-files
